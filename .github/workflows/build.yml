name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[vision,dev]"
      - run: pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # torch нужен только для экспорта YOLO в ONNX; в exe он не попадает.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[vision,export]" "pyinstaller>=6.10"

      - name: Prepare ONNX models
        run: python packaging/prepare_models.py build/models

      - name: Switch to onnxruntime with DirectML
        run: |
          # В exe идёт сборка onnxruntime с DirectML: она умеет и процессор, и любую видеокарту DX12.
          # Только после экспорта моделей: ultralytics при экспорте сам ставит обычный onnxruntime
          # поверх. Оба пакета пишут в одну папку, поэтому сносим оба и ставим DirectML заново.
          pip uninstall -y onnxruntime onnxruntime-directml
          pip install --force-reinstall --no-deps onnxruntime-directml
          python -c "import onnxruntime as o; p = o.get_available_providers(); print(o.__version__, p); assert 'DmlExecutionProvider' in p"

      - name: Build clickmimic.exe
        shell: pwsh
        run: |
          python packaging/build_exe.py build/models
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path dist\clickmimic\_internal\torch) { Write-Error "torch попал в сборку"; exit 1 }
          "{0:N0} МБ" -f ((Get-ChildItem dist\clickmimic -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Smoke test and timing
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          dist\clickmimic\clickmimic.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python packaging/smoke_image.py smoke.png
          dist\clickmimic\clickmimic.exe parse --image smoke.png --repeat 3 --json smoke.json --out smoke_parsed.png
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "--- imgsz 960"
          dist\clickmimic\clickmimic.exe parse --image smoke.png --imgsz 960 --repeat 2 > $null
          Write-Host "--- YOLO и OCR по очереди (для сравнения)"
          dist\clickmimic\clickmimic.exe parse --image smoke.png --sequential --repeat 2 > $null
          Write-Host "--- окно 800x500 (YOLO не растягивает его до 1280)"
          python -c "from PIL import Image; Image.open('smoke.png').crop((0, 0, 800, 500)).save('smoke_small.png')"
          dist\clickmimic\clickmimic.exe parse --image smoke_small.png --repeat 2 > $null
          Write-Host "--- тот же кадр повторно"
          dist\clickmimic\clickmimic.exe parse --image smoke.png --repeat 2 --same-image > $null
          Write-Host "--- DirectML (на раннере без видеокарты это программный адаптер или процессор)"
          $gpu = cmd /c "dist\clickmimic\clickmimic.exe parse --image smoke.png --device gpu --repeat 2 2>&1"
          if ($LASTEXITCODE -ne 0) { Write-Error "parse --device gpu упал"; exit 1 }
          $gpu | Select-String -Pattern "DirectML|Модели|Повтор|Проход" | Select-Object -First 4
          if ("$gpu" -match "AzureExecutionProvider") { Write-Error "в exe попал onnxruntime без DirectML"; exit 1 }
          # Хуки записи ставятся и снимаются в собранном exe.
          dist\clickmimic\clickmimic.exe hooks-test --seconds 1
          if ($LASTEXITCODE -ne 0) { Write-Error "hooks-test упал"; exit 1 }
          # Окно программы: открывается, грузит модели, распознаёт картинку и закрывается.
          dist\clickmimic\clickmimic.exe gui --smoke smoke.png
          if ($LASTEXITCODE -ne 0) { Write-Error "GUI не распознал картинку"; exit 1 }
          # Снимок настоящего экрана раннера: проверяет, что в сборку попал mss.
          dist\clickmimic\clickmimic.exe parse --out screen_parsed.png > $null
          if ($LASTEXITCODE -ne 0) { Write-Error "parse со снимком экрана упал"; exit 1 }
          $els = Get-Content smoke.json -Raw | ConvertFrom-Json
          Write-Host "Найдено элементов: $($els.Count)"
          $texts = ($els | ForEach-Object { $_.content }) -join " | "
          Write-Host $texts
          if ($els.Count -lt 1) { Write-Error "Модель ничего не нашла"; exit 1 }
          if ($texts -notmatch "Отмена") { Write-Error "OCR не распознал кириллицу"; exit 1 }

      - name: Install Russian for Windows OCR
        shell: pwsh
        continue-on-error: true
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~ru-RU~0.0.1.0" | Out-String
          Get-WindowsCapability -Online -Name "Language.OCR*" | Where-Object State -eq Installed | Select-Object Name

      - name: RapidOCR vs Windows OCR
        env:
          PYTHONUTF8: "1"
        run: |
          python packaging/ocr_compare.py build/models smoke.png smoke_small.png
          dist\clickmimic\clickmimic.exe parse --image smoke.png --ocr windows --repeat 2 --json smoke_winocr.json > $null
          if ($LASTEXITCODE -ne 0) { Write-Error "parse --ocr windows упал"; exit 1 }

      - name: Recording speed (full frame vs strip around the click)
        env:
          PYTHONUTF8: "1"
        run: python packaging/record_speed.py build/models smoke.png

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\clickmimic -DestinationPath clickmimic-windows-x64.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: clickmimic-windows-x64
          path: clickmimic-windows-x64.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: |
            smoke.png
            smoke_parsed.png
            smoke.json
            smoke_winocr.json
            screen_parsed.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clickmimic-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: clickmimic-windows-x64.zip
          generate_release_notes: true
