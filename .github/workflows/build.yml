name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[vision,dev]"
      - run: pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # torch нужен только для экспорта YOLO в ONNX; в exe он не попадает.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[vision,export]" "pyinstaller>=6.10"

      - name: Prepare ONNX models
        run: python packaging/prepare_models.py build/models

      - name: Build clickmimic.exe
        shell: pwsh
        run: |
          python packaging/build_exe.py build/models
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path dist\clickmimic\_internal\torch) { Write-Error "torch попал в сборку"; exit 1 }
          "{0:N0} МБ" -f ((Get-ChildItem dist\clickmimic -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Smoke test and timing
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          dist\clickmimic\clickmimic.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python packaging/smoke_image.py smoke.png
          dist\clickmimic\clickmimic.exe parse --image smoke.png --repeat 3 --json smoke.json --out smoke_parsed.png
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\clickmimic\clickmimic.exe parse --image smoke.png --imgsz 960 --repeat 2 > $null
          $els = Get-Content smoke.json -Raw | ConvertFrom-Json
          Write-Host "Найдено элементов: $($els.Count)"
          $texts = ($els | ForEach-Object { $_.content }) -join " | "
          Write-Host $texts
          if ($els.Count -lt 1) { Write-Error "Модель ничего не нашла"; exit 1 }
          if ($texts -notmatch "Отмена") { Write-Error "OCR не распознал кириллицу"; exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\clickmimic -DestinationPath clickmimic-windows-x64.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: clickmimic-windows-x64
          path: clickmimic-windows-x64.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: |
            smoke.png
            smoke_parsed.png
            smoke.json
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clickmimic-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: clickmimic-windows-x64.zip
          generate_release_notes: true
