[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clickmimic"
version = "0.1.0"
description = "Windows UI automation: OmniParser v2 screen parsing + scripted mouse/keyboard input"
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "truststore>=0.9",
    "certifi",
]

[project.optional-dependencies]
# Распознавание: обе модели работают через onnxruntime, torch не нужен.
vision = [
    "onnxruntime>=1.18",
    "rapidocr>=3.4,<3.11",
    # Встроенный OCR Windows 10/11 (--ocr windows)
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]
# Только для подготовки моделей (экспорт YOLO в ONNX): packaging/prepare_models.py
export = [
    "ultralytics>=8.3",
    "onnx",
    "onnxslim",
    "huggingface_hub>=0.24",
]
dev = ["pytest>=8"]

[project.scripts]
clickmimic = "clickmimic.cli:main"

[tool.setuptools.packages.find]
include = ["clickmimic*"]
